name: CI/CD
on: [push]

jobs:
  webapp-code-health:
    name: Code Health (Webapp)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Typecheck
        run: npm run -w webapp typecheck

      - name: Lint
        run: npm run -w webapp lint