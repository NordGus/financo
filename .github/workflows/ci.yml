name: CI/CD
on: [push]

jobs:
  webapp-code-health:
    name: Code Health (Webapp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm install
      - name: Typecheck
        run: npm run -w webapp typecheck
      - name: Lint
        run: npm run -w webapp lint

  server-code-health:
    name: Code Health (Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: go mod download

      - name: Typecheck cmd/web
        run: go vet ./cmd/web

      - name: Typecheck cmd/database/create
        run: go vet -tags development ./cmd/database/create

      - name: Typecheck cmd/database/drop
        run: go vet -tags development ./cmd/database/drop

      - name: Typecheck cmd/database/seed
        run: go vet -tags development ./cmd/database/seed

      - name: Go Build
        run: go build -o ./tmp/build/web -tags development ./cmd/web
