name: "financo"

services:
  valkey:
    image: valkey/valkey:8
    restart: always
    command: valkey-server --port 6379
    volumes:
      - valkey-data:/data

  postgres:
    image: postgres:16.1
    restart: always
    environment:
      POSTGRES_USER: "financo"
      POSTGRES_PASSWORD: "local_dev"
      POSTGRES_DB: "financo_dev"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  devcontainer:
    build:
      dockerfile: .devcontainer/devcontainer-v2.Dockerfile
      context: .
    user: vscode
    env_file: .env
    volumes:
      - .:/workspaces/financo:cached
      - ${HOME}/.ssh:/home/vscode/.ssh:ro
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      - valkey
      - postgres

volumes:
  postgres-data:
  valkey-data:
