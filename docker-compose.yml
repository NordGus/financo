name: "financo"

services:
  valkey:
    image: valkey/valkey:8
    restart: always
    command: valkey-server --port 6379
    volumes:
      - valkey-data:/data
    ports:
      - 6379:6379

  postgres:
    image: postgres:16.1
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: "financo"
      POSTGRES_PASSWORD: "local_dev"
      POSTGRES_DB: "financo_dev"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  valkey-data:
